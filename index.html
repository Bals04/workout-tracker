<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bals workout planner v1.0</title>
<meta name="description" content="Plan and track your Monday–Friday workouts. Set your own sets and reps, mark rest days, works offline.">
<meta name="theme-color" content="#0B0D10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4F6F8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bals Planner">
<link rel="manifest" href="app.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<div class="app">

  <!-- ══ Header ══ -->
  <header class="appbar">
    <div class="brand">
      <span class="brand__tile" aria-hidden="true">
        <svg viewBox="0 0 512 512">
          <g fill="currentColor">
            <rect x="76"  y="217" width="35"  height="78"  rx="17"/>
            <rect x="129" y="171" width="46"  height="170" rx="23"/>
            <rect x="169" y="232" width="174" height="48"  rx="24"/>
            <rect x="337" y="171" width="46"  height="170" rx="23"/>
            <rect x="401" y="217" width="35"  height="78"  rx="17"/>
          </g>
        </svg>
      </span>
      <span class="brand__text">
        <h1 class="brand__name">Bals workout planner</h1>
        <span class="brand__meta">
          <span class="brand__ver">v1.0</span>
          <span class="brand__dot" aria-hidden="true"></span>
          <span class="brand__scope">Mon–Fri</span>
        </span>
      </span>
    </div>
    <div class="appbar__actions">
      <button class="iconbtn" id="btn-theme" type="button" aria-label="Switch theme" title="Switch theme">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-sun"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></g></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-moon"><path d="M20 14.6A8.5 8.5 0 1 1 9.4 4a7 7 0 0 0 10.6 10.6Z" fill="currentColor"/></svg>
      </button>
      <button class="iconbtn" id="btn-settings" type="button" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.9" fill="none"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06A2 2 0 1 1 7.13 4.14l.06.06a1.7 1.7 0 0 0 1.87.34H9.1a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9.1a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.03Z" stroke="currentColor" stroke-width="1.7" fill="none"/></svg>
      </button>
    </div>
  </header>

  <!-- ══ Main ══ -->
  <main class="main" id="main" tabindex="-1">
    <section class="view" id="view-today" data-view="today" hidden></section>
    <section class="view" id="view-week"  data-view="week"  hidden></section>
    <section class="view" id="view-stats" data-view="stats" hidden></section>
  </main>

  <!-- ══ Bottom nav ══ -->
  <nav class="tabbar" aria-label="Main">
    <!-- slides to sit behind the active tab; geometry set in app.js -->
    <span class="tabbar__pill" aria-hidden="true"></span>

    <button class="tab" type="button" data-nav="today" aria-current="page">
      <span class="tab__icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6M20 9v6M7 6.6v10.8M17 6.6v10.8M7 12h10" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" fill="none"/></svg>
      </span>
      <span class="tab__label">Today</span>
    </button>

    <button class="tab" type="button" data-nav="week">
      <span class="tab__icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.2" y="5" width="17.6" height="15" rx="2.8" stroke="currentColor" stroke-width="1.9" fill="none"/><path d="M3.2 9.8h17.6M8 3.2v3.4M16 3.2v3.4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" fill="none"/><rect class="tab__icon-fill" x="6.6" y="12.4" width="4" height="4" rx="1.2" fill="currentColor"/></svg>
      </span>
      <span class="tab__label">Plan</span>
    </button>

    <button class="tab" type="button" data-nav="stats">
      <span class="tab__icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 19V12.5M9.8 19V8M15.1 19v-4.4M20.4 19V5.5" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" fill="none"/></svg>
      </span>
      <span class="tab__label">Progress</span>
    </button>
  </nav>

</div>

<!-- ══ Sheet host (exercise picker / settings / editors) ══ -->
<div class="sheet-host" id="sheet-host" hidden>
  <div class="sheet-scrim" data-close-sheet></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet__grip" data-close-sheet aria-hidden="true"></div>
    <header class="sheet__head">
      <h2 class="sheet__title" id="sheet-title"></h2>
      <button class="iconbtn" type="button" data-close-sheet aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </header>
    <div class="sheet__body" id="sheet-body"></div>
  </div>
</div>

<!-- ══ Rest timer dock ══ -->
<div class="resttimer" id="resttimer" hidden>
  <svg class="resttimer__ring" viewBox="0 0 40 40" aria-hidden="true">
    <circle cx="20" cy="20" r="17" class="resttimer__track"/>
    <circle cx="20" cy="20" r="17" class="resttimer__prog" id="rest-prog"/>
  </svg>
  <div class="resttimer__text">
    <strong id="rest-remaining">1:30</strong>
    <span>Rest</span>
  </div>
  <div class="resttimer__btns">
    <button class="chip chip--sm" type="button" id="rest-add">+15s</button>
    <button class="chip chip--sm" type="button" id="rest-skip">Skip</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/catalog.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
